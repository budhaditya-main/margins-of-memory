<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Margins Of Memory</title>

<meta
  name="description"
  content="An individual record from Margins Of Memory, a counter-archive of Indian political cartoons."
>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link
  rel="preconnect"
  href="https://fonts.gstatic.com"
  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap"
  rel="stylesheet"
>

<link rel="stylesheet" href="css/style.css">

</head>


<body class="record-page">


<header class="record-header">

  <div class="wrap record-header-inner">

    <a
      href="index.html"
      class="record-brand"
    >
      Margins Of Memory
    </a>

    <a
      href="archive.html"
      class="record-archive-link"
    >
      ← Archive
    </a>

  </div>

</header>


<main id="recordContent">


<!-- =====================================================
     RECORD INTRO
     ===================================================== -->

<section class="record-intro wrap">

  <div class="record-heading">

    <p
      class="record-id"
      id="recordId"
    ></p>

    <h1 id="recordTitle"></h1>

    <p
      class="record-artist"
      id="recordArtist"
    ></p>

    <div class="record-basic">

      <span id="recordDate"></span>

      <span>//</span>

      <span>Political Cartoon</span>

    </div>

  </div>


  <div class="record-side-intro">

    <p id="recordIntro"></p>

  </div>

</section>



<!-- =====================================================
     ARTWORK + RECORD
     ===================================================== -->

<section class="record-feature wrap">


  <figure class="record-art">

    <div class="record-art-frame">

      <img
        id="recordImage"
        src=""
        alt=""
      >

    </div>


    <figcaption>

  <span>Archive record</span>

  <span id="recordCaption"></span>

    </figcaption>

  </figure>



  <aside class="record-sidebar">


    <!-- THE RECORD -->

    <div class="record-block">

      <p class="record-section-label">
        The record
      </p>


      <dl>

        <div>

          <dt>Artist</dt>

          <dd id="recordArtistMeta"></dd>

        </div>


        <div>

          <dt>Date</dt>

          <dd id="recordDateMeta"></dd>

        </div>


        <div>

          <dt>Language</dt>

          <dd id="recordLanguageMeta"></dd>

        </div>


        <div>

          <dt>Region</dt>

          <dd id="recordRegionMeta"></dd>

        </div>


        <div>

          <dt>Platform</dt>

          <dd id="recordPlatformMeta"></dd>

        </div>


        <div id="publicationRow">

          <dt>Publication</dt>

          <dd id="recordPublicationMeta"></dd>

        </div>

      </dl>

    </div>



    <!-- TRANSLATION -->

    <div
      class="record-block"
      id="translationBlock"
    >

      <p class="record-section-label">
        Translation
      </p>

      <p id="recordTranslation"></p>

    </div>



    <!-- PROVENANCE -->

    <div class="record-block">

      <p class="record-section-label">
        Provenance
      </p>

      <p id="recordProvenance"></p>

    </div>



    <!-- ICG -->

    <div class="record-block">

      <p class="record-section-label">
        ICG selection history
      </p>

      <p id="recordICG"></p>

    </div>


  </aside>

</section>



<!-- =====================================================
     CONTEXT
     ===================================================== -->

<section class="record-body wrap">

  <article class="record-text">

    <p class="record-section-label">
      The cartoon in context
    </p>


    <h2 id="contextTitle"></h2>


    <div id="contextContent"></div>

  </article>

</section>


<!-- =====================================================
     RETURN
     ===================================================== -->

<section class="record-end">

  <div class="wrap">

    <a href="archive.html">
      ← Return to the archive
    </a>

  </div>

</section>


</main>


<script src="js/script.js"></script>

</body>

</html>
